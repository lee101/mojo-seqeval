[project]
name = "mojo-seqeval"
version = "0.1.0"
description = "seqeval sequence-labelling metrics accelerated with Mojo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["mojo", "seqeval", "ner", "sequence-labeling", "metrics"]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "seqeval==1.2.2"]

[project.urls]
Homepage = "https://github.com/lee101/mojo-seqeval"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
